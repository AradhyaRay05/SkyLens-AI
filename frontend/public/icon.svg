<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="sunGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="100" height="100" rx="28" fill="#090D1A" />
  <rect width="96" height="96" x="2" y="2" rx="26" fill="none" stroke="url(#skyGrad)" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Sun Rays & Core -->
  <g filter="url(#sunGlow)">
    <circle cx="64" cy="36" r="19" fill="url(#sunGrad)" />
  </g>

  <!-- Puffy Cloud -->
  <path d="M28 72 C20 72 15 67 15 60 C15 54 19 50 25 49 C26 40 34 33 44 33 C53 33 60 38 63 46 C67 46 72 50 72 56 C72 64 66 72 58 72 Z" fill="#F8FAFC" />
  <path d="M28 70 C22 70 17 66 17 60 C17 55 21 51 26 50 C27 42 35 36 44 36 C52 36 58 40 61 47 C65 47 69 51 69 56 C69 63 64 70 57 70 Z" fill="#E2E8F0" />
</svg>
